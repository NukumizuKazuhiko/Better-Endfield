name: android-apk

on:
  push:
    branches:
      - fix/android-camera-compat
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'native/**'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK / CMake / platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fetch Dobby source (gitignored vendored dep)
        run: |
          mkdir -p tools/android-toolchain/dobby-1.0.5
          curl -sfL https://github.com/BepInEx/Dobby/archive/refs/tags/v1.0.5.tar.gz \
            | tar xz --strip-components=1 -C tools/android-toolchain/dobby-1.0.5
          # v1.0.5 builds example/ unconditionally; it needs DobbyInstrument /
          # DobbySymbolResolver which Better-Endfield disables. Drop the example.
          sed -i '/add_subdirectory(example)/d' tools/android-toolchain/dobby-1.0.5/CMakeLists.txt
          test -f tools/android-toolchain/dobby-1.0.5/CMakeLists.txt

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: better-endfield-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
